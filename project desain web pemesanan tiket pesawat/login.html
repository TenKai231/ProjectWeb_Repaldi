<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - SkyBook</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { background: linear-gradient(135deg,#0D0D1A 0%,#1A1A2E 50%,#0F3460 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; overflow:hidden; }
body::before { content:'✈'; font-size:20rem; position:absolute; right:-80px; top:50%; transform:translateY(-50%); opacity:0.03; pointer-events:none; }
.login-container { width:100%; max-width:480px; }
.login-card { background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.4); }
.login-header { background:linear-gradient(135deg,var(--primary),#FF3D00); padding:36px 36px 28px; text-align:center; }
.login-header h1 { color:#fff; font-size:1.6rem; margin-bottom:4px; }
.login-header p { color:rgba(255,255,255,0.85); font-size:0.9rem; }
.login-body { padding:32px 36px 36px; }
.login-tabs { display:flex; background:var(--light-gray); border-radius:12px; padding:4px; margin-bottom:28px; }
.login-tab { flex:1; text-align:center; padding:10px; border-radius:9px; cursor:pointer; font-weight:700; font-size:0.85rem; font-family:'Poppins',sans-serif; color:var(--text-light); transition:all var(--transition); }
.login-tab.active { background:#fff; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
.demo-box { background:var(--light-gray); border-radius:12px; padding:14px 18px; margin-bottom:20px; border:1px dashed var(--border); }
.demo-box p { font-size:0.78rem; color:var(--text-light); margin-bottom:6px; font-weight:600; }
.demo-item { display:flex; align-items:center; justify-content:space-between; font-size:0.82rem; margin-bottom:2px; }
.demo-item span:first-child { color:var(--text-light); font-weight:600; }
.demo-item span:last-child { font-weight:700; color:var(--dark2); font-family:'Poppins',sans-serif; cursor:pointer; }
.demo-item span:last-child:hover { color:var(--primary); }
.password-toggle { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1rem; }
.back-home { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; color:rgba(255,255,255,0.6); font-size:0.85rem; font-weight:600; transition:color var(--transition); }
.back-home:hover { color:#fff; }
</style>
</head>
<body>
<div class="login-container fade-in">
  <a href="index.html" class="back-home">← Kembali ke Beranda</a>
  <div class="login-card">
    <div class="login-header">
      <div style="font-size:2.5rem;margin-bottom:8px;">✈️</div>
      <h1>Selamat Datang!</h1>
      <p>Masuk ke akun SkyBook Anda</p>
    </div>
    <div class="login-body">
      <div class="login-tabs">
        <div class="login-tab active" id="tabCustomer" onclick="switchTab('customer')">👤 Customer</div>
        <div class="login-tab" id="tabAdmin" onclick="switchTab('admin')">🛡️ Admin</div>
      </div>

      <div class="demo-box">
        <p>🎯 Demo Akun:</p>
        <div class="demo-item" id="demoInfo">
          <span>Email:</span><span onclick="fillDemo('email')" title="Klik untuk isi">budi@email.com</span>
          <span style="margin-left:12px">Password:</span><span onclick="fillDemo('pass')" title="Klik untuk isi">user123</span>
        </div>
        <p style="margin-top:6px;font-size:0.72rem;">👆 Klik untuk otomatis isi</p>
      </div>

      <div id="loginError" class="alert alert-danger hidden"></div>

      <div class="form-group">
        <label class="form-label">📧 Email</label>
        <input type="email" class="form-control" id="email" placeholder="contoh@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">🔒 Password</label>
        <div class="relative">
          <input type="password" class="form-control" id="password" placeholder="Masukkan password" style="padding-right:48px" autocomplete="current-password">
          <span class="password-toggle" onclick="togglePwd()">👁️</span>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
        <a href="#" style="font-size:0.83rem;color:var(--primary);font-weight:600;">Lupa password?</a>
      </div>
      <button class="btn btn-primary btn-block btn-lg" onclick="doLogin()" id="loginBtn">
        🚀 Masuk Sekarang
      </button>
      <div class="divider"></div>
      <p style="text-align:center;font-size:0.88rem;">Belum punya akun? <a href="register.html" style="color:var(--primary);font-weight:700;">Daftar Gratis →</a></p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  // If already logged in, redirect
  if (SkyBookAuth.isLoggedIn()) {
    const user = SkyBookAuth.getSession();
    window.location.href = user.role === 'admin' ? 'admin/index.html' : 'index.html';
  }

  let currentTab = 'customer';
  const demos = {
    customer: { email: 'budi@email.com', pass: 'user123' },
    admin: { email: 'admin@skybook.com', pass: 'admin123' }
  };

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabCustomer').classList.toggle('active', tab === 'customer');
    document.getElementById('tabAdmin').classList.toggle('active', tab === 'admin');
    const d = demos[tab];
    document.getElementById('demoInfo').innerHTML = `
      <span>Email:</span><span onclick="fillDemo('email')" title="Klik untuk isi">${d.email}</span>
      <span style="margin-left:12px">Password:</span><span onclick="fillDemo('pass')" title="Klik untuk isi">${d.pass}</span>`;
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('loginError').classList.add('hidden');
  }

  function fillDemo(type) {
    const d = demos[currentTab];
    if (type === 'email') document.getElementById('email').value = d.email;
    else document.getElementById('password').value = d.pass;
  }

  function togglePwd() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errEl.classList.add('hidden');

    if (!email) { showError('Email tidak boleh kosong'); return; }
    if (!password) { showError('Password tidak boleh kosong'); return; }

    btn.disabled = true;
    btn.textContent = '⏳ Memeriksa...';

    setTimeout(() => {
      const result = SkyBookAuth.login(email, password);
      if (result.success) {
        SkyBook.toast('Login berhasil! Selamat datang, ' + result.user.name.split(' ')[0] + ' 👋', 'success');
        setTimeout(() => {
          const redirect = new URLSearchParams(window.location.search).get('redirect');
          if (redirect) { window.location.href = redirect; return; }
          window.location.href = result.user.role === 'admin' ? 'admin/index.html' : 'index.html';
        }, 800);
      } else {
        showError(result.message);
        btn.disabled = false;
        btn.textContent = '🚀 Masuk Sekarang';
      }
    }, 600);
  }

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = '⚠️ ' + msg;
    el.classList.remove('hidden');
  }

  document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
