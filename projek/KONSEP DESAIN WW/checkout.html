<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<link rel="stylesheet" href="checkout.css">
</head>

<body>

<div class="container">

    <h1>Checkout Penerbangan 💳</h1>

    <div class="layout">

        <!-- KIRI -->
        <div class="left">

            <div class="card highlight">
                <h3>Detail Penerbangan</h3>
                <div id="detail"></div>
            </div>

            <div class="card">
                <h3>Data Penumpang</h3>
                <input type="text" id="nama" placeholder="Nama Lengkap">
                <input type="text" id="ktp" placeholder="Nomor KTP / Passport">
                <input type="email" id="email" placeholder="Email">
            </div>

            <div class="card">
                <h3>Metode Pembayaran</h3>
                <select id="pembayaran">
                    <option>Transfer Bank</option>
                    <option>E-Wallet (OVO / DANA)</option>
                    <option>Kartu Kredit</option>
                </select>
            </div>

        </div>

        <!-- KANAN -->
        <div class="right">
            <div class="card sticky">

                <h3>Ringkasan Pembayaran</h3>

                <div class="summary">
                    <p>Harga Tiket</p>
                    <p id="harga"></p>
                </div>

                <div class="summary total">
                    <p>Total</p>
                    <p id="total"></p>
                </div>

                <button onclick="bayar()">Bayar Sekarang</button>

            </div>
        </div>

    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const maskapai = params.get("maskapai");
const jam = params.get("jam");
const harga = parseInt(params.get("harga"));
const asal = params.get("asal") || "-";
const tujuan = params.get("tujuan") || "-";

// tampilkan detail
document.getElementById("detail").innerHTML = `
    <p><b>${maskapai}</b></p>
    <p>${asal} → ${tujuan}</p>
    <p>🕒 ${jam}</p>
`;
// tampilkan harga
document.getElementById("harga").innerText = "Rp " + harga.toLocaleString();
document.getElementById("total").innerText = "Rp " + harga.toLocaleString();

// validasi
function bayar() {
    const nama = document.getElementById("nama").value;
    const ktp = document.getElementById("ktp").value;
    const email = document.getElementById("email").value;

    if (!nama || !ktp || !email) {
        alert("Isi semua data penumpang dulu!");
        return;
    }

    alert("Pembayaran berhasil! 🎉");
}

</script>

</body>
</html>
