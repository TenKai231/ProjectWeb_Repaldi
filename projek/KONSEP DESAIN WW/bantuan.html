<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Service - Booking Nest</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===============================
   GLOBAL
=============================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #2d89ef, #6fb1fc);
    min-height: 100vh;
}

/* ===============================
   HEADER
=============================== */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 10%;
    color: white;
}

header h1 {
    font-size: 24px;
    font-weight: 600;
}

header a {
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.2);
    padding: 10px 18px;
    border-radius: 8px;
    transition: 0.3s;
}

header a:hover {
    background: rgba(255,255,255,0.35);
}

/* ===============================
   MAIN BOX
=============================== */
.wrapper {
    background: white;
    margin: 40px auto;
    width: 90%;
    max-width: 1100px;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.cs-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
}

/* ===============================
   SEARCH BOX
=============================== */
.search-box {
    margin-bottom: 30px;
    text-align: center;
}

.search-box input {
    width: 100%;
    max-width: 400px;
    padding: 12px 15px;
    border-radius: 25px;
    border: 1px solid #ddd;
    outline: none;
}

/* ===============================
   LAYOUT
=============================== */
.cs-container {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
}

/* ===============================
   FAQ
=============================== */
.cs-left {
    flex: 2;
}

.faq-item {
    background: #f7f9fc;
    border-radius: 12px;
    margin-bottom: 15px;
    overflow: hidden;
    transition: 0.3s;
}

.faq-item:hover {
    transform: translateY(-3px);
}

.faq-question {
    width: 100%;
    padding: 18px;
    border: none;
    background: transparent;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    font-weight: 500;
}

.faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: 0.4s ease;
    padding: 0 18px;
}

.faq-answer img {
    width: 100%;
    margin: 15px 0;
    border-radius: 10px;
}

/* ACTIVE */
.faq-item.active .faq-answer {
    max-height: 500px;
}

/* ===============================
   CONTACT BOX
=============================== */
.cs-right {
    flex: 1;
    background: linear-gradient(135deg, #25D366, #1ebe5d);
    color: white;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
}

.cs-right h3 {
    margin-bottom: 10px;
}

.cs-right p {
    font-size: 14px;
}

/* BUTTON */
.wa-button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 25px;
    background: white;
    color: #25D366;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.wa-button:hover {
    transform: scale(1.05);
}

/* ===============================
   RESPONSIVE
=============================== */
@media(max-width: 768px) {
    .cs-container {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<header>
    <h1>Booking Nest</h1>
    <a href="index.html">← Kembali</a>
</header>

<div class="wrapper">

    <h2 class="cs-title">Customer Service</h2>

    <!-- SEARCH -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari bantuan...">
    </div>

    <div class="cs-container">

        <!-- FAQ -->
        <div class="cs-left" id="faqList">

            <div class="faq-item">
                <button class="faq-question">✈️ Cara Pemesanan Tiket</button>
                <div class="faq-answer">
                    <img src="img/carapesan.png">
                </div>
            </div>

            <div class="faq-item">
                <button class="faq-question">📅 Perubahan Jadwal</button>
                <div class="faq-answer">
                    <img src="images/reschedule.png">
                </div>
            </div>

            <div class="faq-item">
                <button class="faq-question">🧾 Perubahan Nama Penumpang</button>
                <div class="faq-answer">
                    <img src="images/nama.png">
                </div>
            </div>

        </div>

        <!-- CONTACT -->
        <div class="cs-right">
            <h3>Butuh Bantuan?</h3>
            <p>Tim kami siap membantu Anda secara langsung melalui WhatsApp.</p>

            <a href="https://wa.me/6281234567890" target="_blank" class="wa-button">
                Chat Sekarang
            </a>
        </div>

    </div>

</div>

<script>

/* FAQ TOGGLE */
const items = document.querySelectorAll(".faq-item");

items.forEach(item => {
    item.querySelector(".faq-question").addEventListener("click", () => {
        item.classList.toggle("active");
    });
});

/* SEARCH FUNCTION */
const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function() {
    const value = this.value.toLowerCase();
    const faqItems = document.querySelectorAll(".faq-item");

    faqItems.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(value) ? "block" : "none";
    });
});

</script>

</body>
</html>
