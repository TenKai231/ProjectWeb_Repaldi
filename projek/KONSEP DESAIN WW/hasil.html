<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hasil Penerbangan</title>
<link rel="stylesheet" href="hasil.css">

</head>

<body>

<h2 id="judul"></h2>

<div id="hasil-container"></div>

<script>
const params = new URLSearchParams(window.location.search);

const asal = params.get("asal");
const tujuan = params.get("tujuan");
const tanggal = params.get("tanggal");
const penumpang = params.get("penumpang") || 1;

document.getElementById("judul").innerText =
    `Penerbangan ${asal} → ${tujuan} (${tanggal}) | ${penumpang} Penumpang`;

/* DATA MASKAPAI */
const maskapaiList = [
    {
        nama: "Garuda Indonesia",
        logo: "img/garuda2.jpeg",
        base: 1200000
    },
    {
        nama: "Lion Air",
        logo: "img/lion air.png",
        base: 800000
    },
    {
        nama: "AirAsia",
        logo: "img/airasia.png",
        base: 900000
    },
    {
        nama: "Batik Air",
        logo: "img/batik1.png",
        base: 850000
    },
    {
        nama: "Wings Air",
        logo: "img/wings.png",
        base: 850000
    },
    {
        nama: "Sriwijaya Air",
        logo: "img/sriwijaya.png",
        base: 850000
    },
    {
        nama: "Malaysia Airlanes",
        logo: "img/malaysia.png",
        base: 850000
    },
    {
        nama: "Etihad Airways",
        logo: "img/etihad.png",
        base: 850000
    },
    {
        nama: "Firefly",
        logo: "img/fire.png",
        base: 850000
    },
    {
        nama: "Air Asia Indonesia",
        logo: "img/airindo.png",
        base: 850000
    },
    {
        nama: "Garuda Indonesia",
        logo: "img/garuda2.jpeg",
        base: 1200000
    },
    {
        nama: "Lion Air",
        logo: "img/lion air.png",
        base: 800000
    },
    {
        nama: "AirAsia",
        logo: "img/airasia.png",
        base: 900000
    },
    {
        nama: "Batik Air",
        logo: "img/batik1.png",
        base: 850000
    },
    {
        nama: "Wings Air",
        logo: "img/wings.png",
        base: 850000
    },
    {
        nama: "Sriwijaya Air",
        logo: "img/sriwijaya.png",
        base: 850000
    },
    {
        nama: "Malaysia Airlanes",
        logo: "img/malaysia.png",
        base: 850000
    },
    {
        nama: "Etihad Airways",
        logo: "img/etihad.png",
        base: 850000
    },
    {
        nama: "Firefly",
        logo: "img/fire.png",
        base: 850000
    },
    {
        nama: "Air Asia Indonesia",
        logo: "img/airindo.png",
        base: 850000
    }
];

/* FUNCTION RANDOM */
function randomJam() {
    let jam = Math.floor(Math.random() * 24);
    let menit = Math.floor(Math.random() * 60);
    return `${jam.toString().padStart(2,'0')}:${menit.toString().padStart(2,'0')}`;
}

function tambahJam(jamAwal, durasi) {
    let [h, m] = jamAwal.split(":").map(Number);
    h += durasi;
    if (h >= 24) h -= 24;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
}

/* GENERATE DATA RANDOM */
let hasil = [];

maskapaiList.forEach(m => {
    let jamBerangkat = randomJam();
    let durasi = Math.floor(Math.random() * 3) + 1; // 1-3 jam
    let jamTiba = tambahJam(jamBerangkat, durasi);

    let hargaRandom = m.base + Math.floor(Math.random() * 300000);
    let totalHarga = hargaRandom * penumpang;

    hasil.push({
        maskapai: m.nama,
        logo: m.logo,
        jam: `${jamBerangkat} - ${jamTiba}`,
        durasi: `${durasi} jam`,
        harga: totalHarga
    });
});

/* CARI TERMURAH & TERCEPAT */
const termurah = Math.min(...hasil.map(h => h.harga));
const tercepat = Math.min(...hasil.map(h => parseInt(h.durasi)));

/* TAMPILKAN */
const container = document.getElementById("hasil-container");

hasil.forEach(item => {
    const div = document.createElement("div");
    div.classList.add("flight-card");

    let label = "";
    if (item.harga === termurah) {
        label = `<span style="color:green;font-size:12px;">Termurah</span>`;
    } else if (parseInt(item.durasi) === tercepat) {
        label = `<span style="color:orange;font-size:12px;">Tercepat</span>`;
    }

    div.innerHTML = `
        <div class="flight-left">
            <img src="${item.logo}">
            <div>
                <div class="maskapai">${item.maskapai}</div>
                <div class="durasi">${item.durasi} ${label}</div>
            </div>
        </div>

        <div class="flight-middle">
            <div class="jam">${item.jam}</div>
        </div>

        <div class="flight-right">
            <div class="harga">Rp ${item.harga.toLocaleString()}</div>
           <button class="btn-pilih" onclick="lanjutBooking('${item.maskapai}', '${item.jam}', ${item.harga})">Pilih</button>
    `;

    container.appendChild(div);
});

/* BUTTON PILIH */
function lanjutBooking(maskapai, jam, harga) {
    const url = `checkout.html?maskapai=${encodeURIComponent(maskapai)}&jam=${encodeURIComponent(jam)}&harga=${harga}&asal=${encodeURIComponent(asal)}&tujuan=${encodeURIComponent(tujuan)}`;
    window.location.href = url;
}
</script>

</body>
</html>
