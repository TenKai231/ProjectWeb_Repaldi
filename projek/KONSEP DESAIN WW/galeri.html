<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Galeri Pesawat</title>
  <link rel="stylesheet" href="galeri.css">
</head>
<body>

<h1 class="title">GALERI AIRPLANES</h1>

<section class="gallery">

  <!-- 15 FOTO -->
  <div class="item"><img src="img/foto1.jpg"></div>
  <div class="item"><img src="img/foto2.jpg"></div>
  <div class="item"><img src="img/foto3.jpg"></div>
  <div class="item"><img src="img/foto4.jpg"></div>
  <div class="item"><img src="img/foto5.jpg"></div>

  <div class="item"><img src="img/foto6.jpg"></div>
  <div class="item"><img src="img/foto7.jpg"></div>
  <div class="item"><img src="img/foto8.jpg"></div>
  <div class="item"><img src="img/foto9.jpg"></div>
  <div class="item"><img src="img/foto10.jpg"></div>

  <div class="item"><img src="img/foto11.jpg"></div>
  <div class="item"><img src="img/foto12.jpg"></div>
  <div class="item"><img src="img/foto13.jpg"></div>
  <div class="item"><img src="img/foto14.jpg"></div>
  <div class="item"><img src="img/foto15.jpg"></div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>
  <img class="lightbox-img" id="lightbox-img">
</div>

<script>
  const images = document.querySelectorAll('.item img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const close = document.querySelector('.close');

  images.forEach(img => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
    });
  });

  close.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target !== lightboxImg) {
      lightbox.style.display = 'none';
    }
  });
</script>

</body>
</html>
