<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Air • Masuk</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="azureairlogin.css">
</head>
<body>

  <!-- Background foto (ditangani via CSS body::before) -->

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">✈️</div>
        <span class="brand-name">Azure <em>Air</em></span>
      </div>

      <!-- Heading -->
      <h2>Selamat Datang Kembali</h2>
      <p class="subtitle">Masuk untuk melanjutkan pemesanan tiket Anda</p>

      <!-- Form Login -->
      <form id="loginForm" class="auth-form" novalidate>

        <!-- Email -->
        <div class="input-group">
          <div class="input-wrap">
            <i class="fas fa-envelope field-icon"></i>
            <input
              type="email"
              id="loginEmail"
              placeholder="Alamat Email"
              autocomplete="email"
            >
          </div>
          <span class="error-message" id="loginEmailError"></span>
        </div>

        <!-- Password -->
        <div class="input-group">
          <div class="input-wrap">
            <i class="fas fa-lock field-icon"></i>
            <input
              type="password"
              id="loginPassword"
              placeholder="Kata Sandi"
              autocomplete="current-password"
            >
            <!-- Tombol mata — posisi fix di dalam input-wrap -->
            <button type="button" class="toggle-password" tabindex="-1" aria-label="Tampilkan/sembunyikan kata sandi">
              <i class="far fa-eye"></i>
            </button>
          </div>
          <span class="error-message" id="loginPasswordError"></span>
        </div>

        <!-- Opsi -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span class="checkmark"></span>
            Ingat saya
          </label>
          <a href="#" class="forgot-link" id="forgotPasswordLink">Lupa kata sandi?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary" id="submitBtn">
          <span>Masuk</span>
          <i class="fas fa-arrow-right"></i>
        </button>

        <!-- Divider -->
        <div class="divider"><span>atau masuk dengan</span></div>

        <!-- Google -->
        <button type="button" class="btn-social">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          <span>Lanjutkan dengan Google</span>
        </button>

      </form>

      <!-- Footer -->
      <p class="switch-message">
        Belum punya akun?
        <a href="azureairregister.html" class="switch-link">Daftar gratis</a>
      </p>

    </div>

    <!-- Copyright kecil di bawah kartu -->
    <p class="page-copyright">© 2025 Azure Air. Penerbangan aman &amp; nyaman.</p>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="alert" aria-live="polite">
    <div class="toast-icon-wrap" id="toastIconWrap">
      <i class="fas fa-check-circle" id="toastIcon"></i>
    </div>
    <span id="toastMessage">Pesan</span>
  </div>

  <script src="azureairlogin.js"></script>
</body>
</html>
